name: build-cli

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            bin: quanllm-cli
          - os: windows-latest
            target: windows-x86_64
            bin: quanllm-cli.exe
          - os: macos-14
            target: macos-arm64
            bin: quanllm-cli
          - os: macos-13
            target: macos-x86_64
            bin: quanllm-cli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai sympy pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --name quanllm-cli --clean --noconfirm src/quanllm_cli.py

      - name: Package release
        shell: bash
        run: |
          pkg="quanllm-cli-${{ matrix.target }}"
          mkdir -p "release/$pkg"
          cp "dist/${{ matrix.bin }}" "release/$pkg/"
          cp APIKEY.example 使用说明.txt "release/$pkg/"
          cd release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Windows 运行器的 git-bash 没有 zip，GNU tar 也不支持 zip 格式，改用 PowerShell
            powershell -NoProfile -Command "Compress-Archive -Path '$pkg' -DestinationPath '$pkg.zip'"
          else
            zip -r "$pkg.zip" "$pkg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: quanllm-cli-${{ matrix.target }}
          path: release/*.zip
